# ============================================================================
# 인스턴스 B — 백엔드 + 프론트(nginx)
#
# ★ 이 파일은 build 하지 않고 ghcr.io 에서 이미지를 pull 한다.
#   1GB / 1-8 OCPU 에서는 Gradle·Vite 빌드가 메모리 부족으로 실패한다.
#   빌드는 GitHub Actions 가 하고, 서버는 받아서 실행만 한다.
#
# 실행:
#   docker compose -f compose.app.yml --env-file .env.app pull
#   docker compose -f compose.app.yml --env-file .env.app up -d
# ============================================================================

name: devnote-app

services:
  backend:
    # IMAGE_OWNER 는 GitHub 사용자명(소문자), IMAGE_TAG 는 보통 main 또는 커밋 SHA.
    image: ghcr.io/${IMAGE_OWNER}/devnote-backend:${IMAGE_TAG:-main}
    container_name: devnote-backend
    environment:
      SPRING_PROFILES_ACTIVE: prod

      # ★ p6spy 가 아닌 순수 mysql 드라이버 URL 을 쓴다. (application-prod.yml 참고)
      #   MYSQL_PRIVATE_HOST 에는 인스턴스 A 의 사설 IP 를 넣는다.
      DATABASE_URL: jdbc:mysql://${MYSQL_PRIVATE_HOST}:3306/${MYSQL_DATABASE}?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC&allowPublicKeyRetrieval=true&useSSL=false
      DATABASE_USERNAME: ${MYSQL_USERNAME}
      DATABASE_PASSWORD: ${MYSQL_PASSWORD}

      # 첫 배포 후에는 never 로 바꿔 매 기동마다 DDL 을 돌지 않게 한다.
      SQL_INIT_MODE: ${SQL_INIT_MODE:-always}

      # 스키마 검증 모드. 기본 validate.
      # Entity 와 schema.sql 이 어긋나 기동이 막히면 임시로 none 을 넣는다.
      JPA_DDL_AUTO: ${JPA_DDL_AUTO:-validate}

      FILE_STORAGE_ROOT: /application/storage
      SERVER_PORT: 8080

      # ★ 반드시 새로 생성한 값을 넣는다. 기본값을 쓰면 저장소를 본 누구나 로그인할 수 있다.
      #   생성 방법은 docs/deployment.md 참고.
      INITIAL_SUPER_ADMIN_PASSWORD_HASH: ${INITIAL_SUPER_ADMIN_PASSWORD_HASH}

      AUTH_SESSION_TIMEOUT: ${AUTH_SESSION_TIMEOUT:-30m}
      AUTH_REMEMBER_ME_DURATION: ${AUTH_REMEMBER_ME_DURATION:-30d}

      # HTTPS(Cloudflare) 적용 후 true. HTTP 로만 테스트하는 동안에는 false 로 둔다.
      SESSION_COOKIE_SECURE: ${SESSION_COOKIE_SECURE:-true}

      # ★ JVM 힙 제한. 이게 없으면 JVM 이 컨테이너 메모리의 1/4 을 기본 힙으로 잡고
      #   메타스페이스·스레드 스택까지 더해져 1GB 를 넘긴다.
      JAVA_TOOL_OPTIONS: >-
        -Xmx320m
        -XX:MaxMetaspaceSize=128m
        -XX:+UseSerialGC
        -Xss512k

    volumes:
      # 업로드 파일이 저장되는 곳. ★ 이 볼륨이 사라지면 첨부파일이 전부 사라진다.
      # scripts/backup.sh 로 주기적으로 백업할 것.
      - devnote-file-storage:/application/storage

    # 포트를 공개하지 않는다. nginx(frontend)가 내부 네트워크로 프록시한다.
    expose:
      - "8080"

    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health/readiness | grep -q UP"]
      interval: 15s
      timeout: 5s
      retries: 20
      # 1/8 OCPU 에서는 기동이 느리다. 넉넉히 준다.
      start_period: 180s

    deploy:
      resources:
        limits:
          memory: 620M

    restart: unless-stopped

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  frontend:
    image: ghcr.io/${IMAGE_OWNER}/devnote-frontend:${IMAGE_TAG:-main}
    container_name: devnote-frontend
    ports:
      # 외부에 열리는 유일한 포트.
      - "80:80"

    # 백엔드가 아직 안 떠도 nginx 는 기동된다.
    # (nginx.conf 가 요청 시점에 DNS 를 조회하도록 되어 있다)
    depends_on:
      - backend

    deploy:
      resources:
        limits:
          memory: 64M

    restart: unless-stopped

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  devnote-file-storage:
