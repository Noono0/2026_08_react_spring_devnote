name: Continuous Integration

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  backend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Backend tests
        working-directory: backend
        run: chmod +x gradlew && ./gradlew clean check

  frontend-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # pnpm-lock.yaml 그대로 설치한다. pnpm 버전은 package.json의 packageManager를 따른다.
      - name: Install dependencies
        working-directory: frontend
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: Create MSW worker
        working-directory: frontend
        run: pnpm exec msw init public --save
      - name: Check frontend
        working-directory: frontend
        run: |
          pnpm run lint
          pnpm run typecheck
          pnpm run test
          pnpm run build
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify repository sources
        run: |
          python -m pip install -r scripts/requirements.txt
          python -m unittest discover -s scripts -p "test_*.py"
          python scripts/verify-static.py

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker images
        run: docker compose build
