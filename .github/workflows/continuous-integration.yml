name: Continuous Integration

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  backend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Backend tests
        working-directory: backend
        run: chmod +x gradlew && ./gradlew clean check

  frontend-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      # pnpm-lock.yaml 그대로 설치한다. pnpm 버전은 package.json의 packageManager를 따른다.
      - name: Install dependencies
        working-directory: frontend
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      - name: Create MSW worker
        working-directory: frontend
        run: pnpm exec msw init public --save
      - name: Check frontend
        working-directory: frontend
        run: |
          pnpm run lint
          pnpm run typecheck
          pnpm run test
          pnpm run build
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify repository sources
        run: |
          python -m pip install -r scripts/requirements.txt
          python -m unittest discover -s scripts -p "test_*.py"
          python scripts/verify-static.py

  # 실제 Chromium으로 핵심 화면을 열어 보는 스모크 테스트.
  # 백엔드 없이 MSW(가짜 서버) 모드로 돌기 때문에 다른 job과 병렬로 실행한다.
  frontend-e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        working-directory: frontend
        env:
          COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
        run: |
          corepack enable
          pnpm install --frozen-lockfile
      # --with-deps: 리눅스 러너에 Chromium 실행에 필요한 시스템 라이브러리도 함께 설치한다.
      - name: Install Playwright Chromium
        working-directory: frontend
        run: pnpm exec playwright install --with-deps chromium
      - name: Run E2E smoke tests
        working-directory: frontend
        run: pnpm run e2e
      # 실패했을 때만 HTML 보고서·스크린샷·trace를 내려받을 수 있게 올린다.
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7

  docker-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Docker images
        run: docker compose build
