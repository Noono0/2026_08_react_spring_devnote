<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="React와 Spring Boot로 만든 개발자 포트폴리오와 단계별 React 학습 프로젝트" />
    <meta name="theme-color" content="#3461ff" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!--
      링크 공유 미리보기(카카오톡·슬랙·디스코드 등)용 Open Graph 정보입니다.
      미리보기 서비스는 JavaScript를 실행하지 않고 이 HTML만 읽으므로 React가 아니라 여기에 적습니다.
      og:image는 전체 주소가 필요해 빌드할 때 VITE_SITE_URL(예: https://devnote.example.com)을 앞에 붙입니다.
      값이 비어 있으면 /og-image.png 상대 주소가 되어 일부 서비스에서는 이미지가 보이지 않습니다.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="DevNote" />
    <meta property="og:title" content="DevNote — 개발자 포트폴리오" />
    <meta property="og:description" content="React 19·TypeScript·Spring Boot·MyBatis·MySQL로 만든 포트폴리오, 업무 History, React 학습 로드맵" />
    <meta property="og:image" content="%VITE_SITE_URL%/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="ko_KR" />
    <meta name="twitter:card" content="summary_large_image" />
    <title>DevNote Portfolio</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
