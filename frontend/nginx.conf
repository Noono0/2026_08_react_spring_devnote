server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker 내부 DNS를 요청 시점에 조회합니다.
    # 백엔드 컨테이너가 아직 시작되지 않았거나 종료되어 있어도
    # Nginx 자체는 정상 기동되어 MSW 더미 모드를 사용할 수 있습니다.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $backend_host backend;

    # Nginx 기본 업로드 한도는 1MB라 그보다 큰 파일은 백엔드에 닿기 전에 413으로 거절됩니다.
    # 백엔드의 spring.servlet.multipart.max-request-size(25MB)와 같은 값으로 맞춥니다.
    client_max_body_size 25m;

    # Playwright는 로그인과 여러 페이지 이동을 기다리므로 일반 API보다 긴 제한을 둡니다.
    location ~ ^/api/v1/utilities/crawler/(run|configurations/[0-9]+/runs)$ {
        proxy_pass http://$backend_host:8080;
        proxy_connect_timeout 3s;
        proxy_read_timeout 660s;
        proxy_send_timeout 660s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-Id $http_x_request_id;
    }

    # 온라인 대전 WebSocket. HTTP 연결을 WebSocket으로 "업그레이드"하려면 Upgrade·Connection 헤더를 넘겨야 한다.
    # 화면이 25초마다 PING을 보내고 서버가 PONG으로 답하므로, 75초 안에 오가는 메시지가 없으면 끊긴 연결로 본다.
    location = /api/v1/online/ws {
        proxy_pass http://$backend_host:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_connect_timeout 3s;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /api/ {
        proxy_pass http://$backend_host:8080;
        proxy_connect_timeout 3s;
        proxy_read_timeout 30s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Request-Id $http_x_request_id;
    }

    location /actuator/ {
        proxy_pass http://$backend_host:8080;
        proxy_connect_timeout 3s;
        proxy_read_timeout 10s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
