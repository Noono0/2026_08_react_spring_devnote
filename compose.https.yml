# 선택적 HTTPS 오버레이. prepare-ip-https.sh로 인증서·nginx 설정을 준비한 뒤 사용한다.
# Optional HTTPS overlay; prepare the certificate and nginx config before using it.
services:
  frontend:
    ports:
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - ./devnote-tls/nginx.conf:/etc/nginx/conf.d/default.conf:ro
